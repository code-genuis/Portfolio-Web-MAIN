<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
        }

        .video-container {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            max-width: 90vw;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        video:focus {
            outline: none;
        }

        video::-webkit-media-controls-panel {
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video controls>
            <source src="youtube.mp4" type="video/mp4">
        </video>
    </div>
</body>
</html>
